name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check package schema
        run: bun run check-package-schema

      - name: Check benchmark schema
        run: bun run check-benchmark-schema

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Node compatibility tests
        run: bun run test:compat

      - name: Build
        run: bun run build

      - name: Check bundle size
        run: bun run check-bundle-size
